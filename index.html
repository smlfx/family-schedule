<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>家里的日程</title>
<meta name="theme-color" content="#0f766e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="家里日程" />
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e8eaee;
  --brand:#0f766e; --brand-soft:#e6f6f3; --amber:#b45309; --amber-soft:#fff7e6;
  --danger:#dc2626; --ok:#16a34a; --r:16px; --sh:0 2px 10px rgba(15,23,42,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.hidden{display:none !important}

#app{height:100%;display:flex;flex-direction:column}

/* ---------- 顶部 ---------- */
#top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;background:#fff;border-bottom:1px solid var(--line)}
.tipcard{
  display:flex;align-items:flex-start;gap:8px;background:var(--amber-soft);
  border:1px solid #f6e3b8;border-radius:14px;padding:9px 11px;
}
.tipcard .em{flex:none;font-size:15px;line-height:1.5}
.tipcard .tx{flex:1;font-size:13.5px;line-height:1.5;color:#7c4a03;min-height:20px}
.tipcard .more{flex:none;font-size:12px;color:#b07d2b;padding:2px 6px;border-radius:8px;background:#fff2d8;align-self:center}
.tipcard.flash{animation:tipin .35s ease}
@keyframes tipin{from{opacity:.25;transform:translateY(-3px)}to{opacity:1;transform:none}}

.datebar{display:flex;align-items:center;gap:8px;margin-top:9px}
.navbtn{width:34px;height:34px;border-radius:10px;background:#f1f3f6;color:#4b5563;font-size:16px;display:flex;align-items:center;justify-content:center}
.navbtn:active{background:#e6e9ee}
.dbox{flex:1;min-width:0}
.dmain{font-size:17px;font-weight:700;letter-spacing:.2px}
.dsub{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{width:34px;height:34px;border-radius:10px;background:#f1f3f6;display:flex;align-items:center;justify-content:center;font-size:16px}

/* ---------- 家人作息条 ---------- */
.people{display:flex;gap:7px;overflow-x:auto;padding:9px 0 1px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:#f2f4f7;
  font-size:12.5px;color:#3f4650;white-space:nowrap;border:1.5px solid transparent}
.pchip.on{background:#fff;border-color:currentColor;font-weight:600;box-shadow:var(--sh)}
.pdot{width:8px;height:8px;border-radius:50%;flex:none}
.psub{color:#98a0ae;font-size:11.5px}
.pchip.on .psub{color:#6b7280}

/* ---------- 主体 ---------- */
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 4px}
.sect{margin-bottom:16px}
.sechead{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.sechead h2{font-size:14.5px;margin:0;font-weight:700;color:#374151}
.sechead .cnt{font-size:12px;color:var(--sub)}
.sechead .hint{margin-left:auto;font-size:11.5px;color:#9ca3af}

.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:11px 12px;display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--brand)}
.card.done{opacity:.55}
.card.done .ctitle{text-decoration:line-through}
.card.past{border-left-color:#c7cbd2}
.ctime{flex:none;width:56px;text-align:center}
.ctime b{display:block;font-size:15px;font-weight:700;letter-spacing:.3px}
.ctime span{display:block;font-size:11px;color:var(--sub)}
.cbody{flex:1;min-width:0}
.ctitle{font-size:15.5px;font-weight:600;word-break:break-word}
.cmeta{margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:11px;padding:1px 7px;border-radius:8px;background:#f1f3f6;color:#4b5563}
.tag.cat{background:var(--brand-soft);color:#0f6f68}
.cnote{font-size:12.5px;color:var(--sub);margin-top:3px;word-break:break-word;white-space:pre-wrap}
.cops{flex:none;display:flex;flex-direction:column;gap:6px}
.cops button{width:32px;height:32px;border-radius:9px;background:#f4f5f7;font-size:14px;display:flex;align-items:center;justify-content:center}
.cops button:active{background:#e8eaee}
.empty{background:#fff;border-radius:var(--r);padding:18px 14px;text-align:center;color:#9ca3af;font-size:13.5px;box-shadow:var(--sh)}
.empty b{display:block;color:#6b7280;font-size:14.5px;margin-bottom:4px;font-weight:600}

/* ---------- 一天的时间分布：上午/下午两条横轴，编号指位置 ---------- */
.tag.who{font-weight:600}
.haxis{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px 8px}
.hblock+.hblock{margin-top:15px}
.hmarks{position:relative}
.hnum{position:absolute;transform:translateX(-50%);font-size:12.5px;font-weight:700;line-height:18px;padding:0 6px;border-radius:9px;white-space:nowrap}
.hstem{position:absolute;width:1px;background:#dfe3e8;transform:translateX(-50%)}
.htrack{position:relative;height:26px;border-radius:9px;background:#eef1f4;cursor:pointer;overflow:hidden}
.hgrid{position:absolute;top:0;bottom:0;width:1px;background:#dce1e7}
.hseg{position:absolute;top:3px;bottom:3px;border-radius:6px;min-width:7px;box-shadow:0 1px 2px rgba(15,23,42,.14)}
.hnow{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--danger);border-radius:1px;pointer-events:none;z-index:3}
.hticks{position:relative;height:15px;margin-top:4px}
.hticks span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:#a8afba}
.hempty{position:absolute;left:0;right:0;top:0;font-size:11.5px;color:#b6bcc6;text-align:center;line-height:18px}
.cnum{display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:50%;font-size:11px;font-weight:700;margin-right:6px;vertical-align:1px}

/* ---------- 底部 ---------- */
#bottom{flex:none;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;padding:7px 12px;border-radius:999px;background:#f2f4f7;color:#3f4650;white-space:nowrap}
.chip:active{background:#e6e9ee}
.chip.hi{background:var(--brand-soft);color:#0c6a63;font-weight:600}
.chip .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;border-radius:8px;background:var(--brand);color:#fff;font-size:10.5px;text-align:center}
.inputrow{display:flex;gap:7px;align-items:center}
#nlInput{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid #e2e5ea;background:#f8f9fb;padding:0 12px;font-size:15px;outline:none}
#nlInput:focus{border-color:var(--brand);background:#fff}
.ibtn{width:44px;height:44px;border-radius:12px;background:#f1f3f6;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.ibtn.rec{background:#fee2e2;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
.sendbtn{flex:none;height:44px;padding:0 15px;border-radius:12px;background:var(--brand);color:#fff;font-weight:600;font-size:15px}
.sendbtn:disabled{background:#cbd5d4}
.parsehint{font-size:11.5px;color:#9ca3af;margin-top:6px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.parsehint.warn{color:#b45309}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:40;opacity:0;transition:opacity .2s}
.mask.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.7,.3,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheethead{flex:none;display:flex;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheethead b{font-size:16.5px;flex:1}
.sheethead .x{width:32px;height:32px;border-radius:10px;background:#f1f3f6;display:flex;align-items:center;justify-content:center;font-size:14px}
.sheetbody{flex:1;overflow-y:auto;padding:14px 16px 20px}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.frow input,.frow select,.frow textarea{width:100%;height:44px;border-radius:12px;border:1px solid #e2e5ea;background:#f8f9fb;padding:0 12px;font-size:15px;outline:none}
.frow textarea{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.5}
.frow input:focus,.frow textarea:focus,.frow select:focus{border-color:var(--brand);background:#fff}
.frow.two{display:flex;gap:10px}
.frow.two>div{flex:1}
.btn{width:100%;height:46px;border-radius:13px;background:var(--brand);color:#fff;font-weight:600;font-size:15.5px}
.btn.ghost{background:#f2f4f7;color:#374151;font-weight:500}
.btn.danger{background:#fef2f2;color:var(--danger)}
.btn+.btn{margin-top:9px}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;background:#f8f9fb;border-radius:12px;padding:10px 12px}
.note.warn{background:var(--amber-soft);color:#8a5a00}
.note b{color:inherit}

/* 吃什么 */
.dish{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.dish .dh{display:flex;align-items:baseline;gap:8px}
.dish .dn{font-size:16px;font-weight:700;flex:1}
.dish .dk{font-size:11px;padding:2px 7px;border-radius:8px;background:var(--brand-soft);color:#0c6a63;flex:none}
.dish .dt{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.dish .di{font-size:12.5px;color:#4b5563;margin-top:7px;line-height:1.55}
.dish .ds{font-size:12.5px;color:#6b7280;margin-top:5px;line-height:1.6}
.dish .dops{display:flex;gap:7px;margin-top:9px}
.dish .dops button{flex:1;height:36px;border-radius:10px;background:#f2f4f7;font-size:13px;color:#374151}
.dish .dops button.p{background:var(--brand-soft);color:#0c6a63;font-weight:600}
.sethead{font-size:13px;color:var(--sub);margin:2px 0 10px}
.formchips{padding-bottom:10px;margin:0 0 2px}
.shopitem{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #f1f3f6}
.shopitem input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.shopitem span{flex:1;font-size:15px}
.shopitem span.done{text-decoration:line-through;color:#9ca3af}
.shopitem .del{color:#c3c8d0;font-size:15px;padding:4px 6px}
.rows{display:flex;gap:9px;flex-wrap:wrap}
.qk{flex:1 1 45%;height:42px;border-radius:12px;background:#f4f5f7;font-size:14px;color:#374151}

/* 家人列表 / 小按钮 */
.personrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f1f3f6}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:15px;font-weight:600}
.pinfo span{font-size:12px;color:var(--sub);line-height:1.45;display:block}
.mini{flex:none;font-size:12.5px;padding:7px 13px;border-radius:9px;background:#f2f4f7;color:#374151;white-space:nowrap}
.mini:active{background:#e6e9ee}
.presets{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.note b{font-weight:600}
#rotPreview{line-height:1.9}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);transform:translate(-50%,14px);background:rgba(31,41,55,.94);color:#fff;font-size:13.5px;padding:9px 14px;border-radius:12px;z-index:80;max-width:88vw;line-height:1.5;opacity:0;pointer-events:none;transition:all .22s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="tipcard" id="tipCard">
      <span class="em">💡</span><span class="tx" id="tipText"></span><span class="more">换一条</span>
    </div>
    <div class="datebar">
      <button class="navbtn" id="dayPrev">‹</button>
      <div class="dbox">
        <div class="dmain" id="dateMain">—</div>
        <div class="dsub" id="dateSub"></div>
      </div>
      <button class="navbtn" id="dayNext">›</button>
      <button class="gear" id="btnSettings">⚙️</button>
    </div>
    <div class="people" id="peopleStrip"></div>
  </header>

  <main id="main">
    <section class="sect">
      <div class="sechead"><h2 id="listTitle">今天的安排</h2><span class="cnt" id="todayCount"></span></div>
      <div id="todayList" class="cards"></div>
    </section>
    <section class="sect">
      <div class="sechead"><h2>一天的时间分布</h2><span class="hint" id="tlHint">点线或编号就能改</span></div>
      <div class="haxis" id="tl"></div>
    </section>
  </main>

  <footer id="bottom">
    <div class="chips">
      <button class="chip hi" id="chipEat">🍚 今天吃什么</button>
      <button class="chip" id="chipShop">🧺 买菜清单<span class="badge hidden" id="shopBadge">0</span></button>
      <button class="chip" id="chipQuick">⚡ 常用</button>
    </div>
    <div class="inputrow">
      <input id="nlInput" placeholder="说一句：我下班后记得提醒我买青椒" autocomplete="off" enterkeyhint="send" />
      <button class="ibtn" id="btnMic" title="语音输入">🎤</button>
      <button class="sendbtn" id="btnSend">安排</button>
    </div>
    <div class="parsehint" id="parseHint"></div>
  </footer>
</div>

<div class="mask hidden" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheethead"><b id="sheetTitle"></b><button class="x" id="sheetClose">✕</button></div>
  <div class="sheetbody" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================ 生活小常识库 ============================
   收录标准：短（一般不超过 30 字）、可验证、贴近日常、不制造焦虑。
   不复述"某某致癌""再不看就晚了"这类营销号说法。 */
const TIPS = [
"关火后让抽油烟机再转 3–5 分钟，能把残余油烟排得更干净。",
"油温七成热（筷子插进去冒小泡）再下菜，不粘锅，油烟也更少。",
"炒青菜全程大火，出锅前再放盐，颜色更绿也不出水。",
"炖牛肉丢几片山楂或一小勺醋，肉更容易炖软。",
"泡木耳用凉水，泡到发开就行，别超过 4 小时。",
"洋葱先冷藏 10 分钟再切，辣眼睛会轻很多。",
"铁锅擦干后薄薄抹一层油，不容易生锈。",
"煮饭时滴几滴食用油，米粒更分明、不粘锅。",
"肉提前一晚放冷藏室解冻，比热水泡更嫩也更放心。",
"生熟用两块砧板，交叉污染能少一大半。",
"盐放在出锅前，汤更鲜，肉也不容易柴。",
"面团醒 20 分钟再擀，做出来更软。",
"蒸馒头蒸好后焖 3 分钟再揭盖，不容易回缩。",
"蛋液里加一点温水，炒出来的蛋更蓬松。",
"切完辣椒手辣，先用食用油搓一搓再洗，比光用水管用。",
"姜蒜末一次切好冻起来，做饭时直接抓一把。",
"绿叶菜擦干水、用厨房纸包着冷藏，能多放好几天。",
"香蕉别和别的水果挤在一起，它会催熟别人。",
"蜂蜜结晶是正常现象，温水化开就能吃。",
"米面豆子密封放阴凉处，能明显少生虫。",
"大米里放几瓣去皮大蒜，能少长虫。",
"食用油避光避热放，不容易变味。",
"鸡蛋大头朝上放冷藏，能多存一阵。",
"番茄放阴凉处风味更好，熟透了再进冰箱。",
"牛奶开封后放冰箱里层，别放在门上的格子里。",
"面包冷冻比冷藏更不容易变干，吃前回烤一下。",
"油污趁温热擦最容易，凉了就得使劲。",
"抽油烟机滤网用热水加洗洁精泡 15 分钟再刷，省一半力气。",
"玻璃用一湿一干两块布擦，水痕少很多。",
"白醋兑水 1:1 敷几分钟再擦，水龙头水垢好擦得多。",
"冰箱门胶条用旧牙刷蘸小苏打水刷，能少发黑。",
"洗衣机每月空转一次高温程序，能少异味。",
"空调滤网两三周洗一次，制冷快也更省电。",
"水槽有异味，倒点小苏打再冲一遍热水，能缓解。",
"拖地水里滴几滴洗洁精就够，放多了会黏脚。",
"垃圾桶底垫一张厨房纸，能吸掉渗出来的水。",
"换季衣服洗净晾透再收，不容易发黄招虫。",
"84 消毒液和洁厕灵千万不能混用，会冒出有毒气体。",
"抹布海绵每周煮沸一次或直接换新，比餐具更该管。",
"冰箱冷藏 0–4℃、冷冻 −18℃ 左右，比反复开关门重要。",
"剩菜不烫手了就尽快冷藏，别在桌上放太久。",
"久坐每 40–60 分钟起身活动两分钟，腰颈会舒服很多。",
"早上起来先喝杯温水，补回一夜流失的水分。",
"每天晒 10–20 分钟太阳，帮身体合成维生素 D。",
"刷牙刷够两分钟，牙缝和牙龈边缘也要带到。",
"洗手用流动水加肥皂搓 20 秒，比只用免洗更干净。",
"看屏幕每 20 分钟望一下 6 米外，眼睛没那么干。",
"午睡 20–30 分钟就够了，睡久了反而更困。",
"睡前 1 小时把手机屏幕调暗，入睡会顺一些。",
"感冒多数是病毒引起的，多喝水多休息，抗生素没用。",
"运动前动态热身 5 分钟、运动后拉伸，能少拉伤。",
"水杯放在伸手就能拿到的地方，自然就喝得多了。",
"吃饭慢一点，大脑收到吃饱的信号大约要 20 分钟。",
"泡脚水温 40℃ 左右、10 分钟就够，别太烫。",
"每天开窗通风两三次，每次 10–20 分钟。",
"走路时把手机放低点、下巴收一点，颈椎压力小。",
"家里备个电子血压计，定期记录比偶尔量一次有用。",
"出门前默念伸手要钱：身份证、手机、钥匙、钱包。",
"买菜前先看一眼冰箱里还有什么，能少买重复的。",
"购物列个清单，能省不少冤枉钱。",
"玄关固定放伞和充电宝的位置，出门不用到处找。",
"重要证件存一份电子版，放在自己找得到的地方。",
"睡前把第二天要穿的衣服拿出来，早上少纠结。",
"快递单上的姓名电话涂掉再扔。",

const $ = (s) => document.querySelector(s);
const pad = (n) => (n < 10 ? "0" + n : "" + n);
const toHM = (m) => pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function dk(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fromKey(k) { const p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }

const WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

const CN_NUM = { 零:0, 一:1, 二:2, 两:2, 三:3, 四:4, 五:5, 六:6, 七:7, 八:8, 九:9, 十:10 };
function cn2num(s) {
  if (s == null) return null;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  if (CN_NUM[s] != null) return CN_NUM[s];
  const m = s.match(/^([一二三四五六七八九])?十([一二三四五六七八九])?$/);
  if (m) return (m[1] ? CN_NUM[m[1]] : 1) * 10 + (m[2] ? CN_NUM[m[2]] : 0);
  return null;
}

/* ============================== 状态与存储 ============================== */
const LS_KEY = "family-schedule-v1";
let canStore = true;
try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { canStore = false; }

/* 三个人、两套作息模式：
   fixed  = 固定班（妈妈那种 8:00 上班、16:00 下班）
   rotate = 轮班（爸爸那种：上一天白班、歇一天、再上夜班）
   rotate.cycle 是一串字，一个字代表一天 —— 白=白班，夜=夜班，休=休息。
   「白夜休」＝三天一轮；要是实际是四天一轮，把它改成「白休夜休」就行。 */
function defaultPeople() {
  return [
    { id: "me", name: "我", color: "#0f766e", mode: "fixed",
      fixed: { workStart: 9 * 60, workEnd: 16 * 60, lunchStart: 12 * 60, lunchEnd: 13 * 60, wake: 7 * 60, sleep: 23 * 60 } },
    { id: "mom", name: "妈妈", color: "#be185d", mode: "fixed",
      fixed: { workStart: 8 * 60, workEnd: 16 * 60, lunchStart: 12 * 60, lunchEnd: 13 * 60, wake: 6 * 60 + 30, sleep: 22 * 60 + 30 } },
    { id: "dad", name: "爸爸", color: "#1d4ed8", mode: "rotate",
      rotate: { cycle: "白夜休", anchor: dk(new Date()), dayStart: 8 * 60, dayEnd: 18 * 60, nightStart: 18 * 60, nightEnd: 8 * 60 } }
  ];
}
function defaultState() {
  return {
    v: 2,
    profile: {
      name: "",
      workStart: 9 * 60, workEnd: 16 * 60, lunchStart: 12 * 60, lunchEnd: 13 * 60, wake: 7 * 60, sleep: 23 * 60,
      avoid: ""               // 家里额外忌口，逗号分隔（全家共用）
    },
    people: defaultPeople(),
    currentPerson: "me",
    deviceId: "",       // 本机编号：第一次打开时生成，每台手机不同
    firstRun: true,     // 首次打开讲一遍隐私
    events: [],
    shop: [],
    seenTips: [],
    seenDishes: [],
    createdAt: dk(new Date())
  };
}
let state = defaultState();

function loadState() {
  if (!canStore) return;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.profile && Array.isArray(o.events)) {
      state = Object.assign(defaultState(), o);
      state.profile = Object.assign(defaultState().profile, o.profile || {});
      if (!Array.isArray(state.shop)) state.shop = [];
      // 老版本数据没有 people，用旧的单一作息补一个人
      if (!Array.isArray(state.people) || !state.people.length) {
        const pp = defaultPeople();
        pp[0].name = state.profile.name || "我";
        pp[0].fixed = {
          workStart: state.profile.workStart, workEnd: state.profile.workEnd,
          lunchStart: state.profile.lunchStart, lunchEnd: state.profile.lunchEnd,
          wake: state.profile.wake, sleep: state.profile.sleep
        };
        state.people = pp;
      }
      state.people = state.people.filter((x) => x && x.id);
      state.people.forEach((x, i) => {
        if (!x.color) x.color = ["#0f766e", "#be185d", "#1d4ed8", "#b45309", "#7c3aed"][i % 5];
        if (x.mode === "rotate") {
          x.rotate = x.rotate || {};
          if (!x.rotate.cycle || !/^[白夜休]+$/.test(x.rotate.cycle)) x.rotate.cycle = "白夜休";
          if (!x.rotate.anchor) x.rotate.anchor = dk(new Date());
          x.rotate.dayStart = x.rotate.dayStart == null ? 8 * 60 : x.rotate.dayStart;
          x.rotate.dayEnd = x.rotate.dayEnd == null ? 18 * 60 : x.rotate.dayEnd;
          x.rotate.nightStart = x.rotate.nightStart == null ? 18 * 60 : x.rotate.nightStart;
          x.rotate.nightEnd = x.rotate.nightEnd == null ? 8 * 60 : x.rotate.nightEnd;
        } else {
          x.mode = "fixed";
          x.fixed = Object.assign({ workStart: 9 * 60, workEnd: 16 * 60, lunchStart: 12 * 60, lunchEnd: 13 * 60, wake: 7 * 60, sleep: 23 * 60 }, x.fixed || {});
        }
      });
      if (!state.people.some((x) => x.id === state.currentPerson)) state.currentPerson = state.people[0].id;
    }
  } catch (e) { console.warn("读取本地数据失败", e); }
}
let saveTimer = null;
function saveState() {
  if (!canStore) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch (e) { toast("保存失败，可能存储空间满了"); }
  }, 120);
}
/* 本机编号：每台手机第一次打开时生成一个，用来确认"这确实是我这台机器上的数据"。
   它只存在本机，不会发给任何人，两台手机永远不会是同一个编号。 */
function deviceTag() {
  if (!state.deviceId) {
    state.deviceId = (Date.now().toString(36) + Math.random().toString(36).slice(2, 5)).toUpperCase().slice(-6);
    saveState();
  }
  return state.deviceId;
}

/* ============================== 分类识别 ============================== */
function detectCat(text) {
  // "买XX" 基本都是要出门采买，除非写明了是药、票、衣服这类
  if (/买/.test(text) && !/买药|买票|买衣服|买鞋|买书|买手机|买家电|买家具|买礼物/.test(text)) return CATS[0];
  for (const c of CATS) {
    for (const k of c.kw) if (text.indexOf(k) >= 0) return c;
  }
  return DEFAULT_CAT;
}

/* ============================== 清真校验 ============================== */
function halalCheck(text) {
  const hits = [];
  for (const g of HALAL_BLOCK) if (g.kw.some((k) => text.indexOf(k) >= 0)) hits.push({ level: "block", why: g.why, fix: g.fix });
  for (const g of HALAL_SOFT) if (g.kw.some((k) => text.indexOf(k) >= 0)) hits.push({ level: "soft", why: g.why, fix: g.fix });
  // 只说"肉"没说是什么肉 → 温和提醒一句，不吓人
  if (text.indexOf("肉") >= 0 && !/牛|羊|鸡|鸭|鹅|鱼|虾|兔|清真/.test(text) && !hits.length) {
    hits.push({ level: "soft", why: "没写清是什么肉", fix: "记得按家里的习惯选清真的牛羊肉或鸡肉。" });
  }
  const extra = (state.profile.avoid || "").split(/[,，、\s]+/).filter(Boolean);
  extra.forEach((w) => { if (text.indexOf(w) >= 0) hits.push({ level: "block", why: "家里不吃「" + w + "」", fix: "换个做法或换食材。" }); });
  return hits;
}

const PERIODS = [
  { re: /凌晨/, h: 5 * 60 }, { re: /清晨|早上|早晨|一早|明早|今早/, h: 6 * 60 + 30 },
  { re: /上午/, h: 9 * 60 + 30 }, { re: /中午|晌午/, h: 12 * 60 },

];

/* ============================== 轮班 / 作息引擎 ============================== */
const SHIFT_CHAR = { "白": "day", "夜": "night", "休": "off" };
function personById(id) { return state.people.find((p) => p.id === id) || state.people[0]; }
function currentPerson() { return personById(state.currentPerson); }
function cycleOf(p) {
  const raw = (p.rotate && p.rotate.cycle) || "白夜休";
  const c = raw.split("").map((ch) => SHIFT_CHAR[ch] || "off");
  return c.length ? c : ["day"];
}
/* 某人在某天是白班 / 夜班 / 休息 */
function shiftTypeOn(p, key) {
  if (!p || p.mode !== "rotate") return "work";
  const cyc = cycleOf(p);
  const a = fromKey(p.rotate.anchor || dk(new Date()));
  const diff = Math.round((fromKey(key).getTime() - a.getTime()) / 86400000);
  return cyc[((diff % cyc.length) + cyc.length) % cyc.length];
}
/* 某人某天的实际作息：轮班的人每天都不一样，这里现算 */
function personOn(p, key) {
  if (!p) return null;
  if (p.mode === "rotate") {
    const r = p.rotate, t = shiftTypeOn(p, key);
    if (t === "night") {
      return { type: "night", label: "夜班", workStart: r.nightStart, workEnd: r.nightEnd + 1440,
               lunchStart: null, lunchEnd: null, wake: r.nightStart - 180, sleep: r.nightEnd + 60, spans: true,
               text: toHM(r.nightStart) + "–明早 " + toHM(r.nightEnd) };
    }
    if (t === "off") {
      return { type: "off", label: "休息", workStart: null, workEnd: null,
               lunchStart: 12 * 60, lunchEnd: 13 * 60, wake: 8 * 60, sleep: 23 * 60, spans: false, text: "休息" };
    }
    return { type: "day", label: "白班", workStart: r.dayStart, workEnd: r.dayEnd,
             lunchStart: 12 * 60, lunchEnd: 13 * 60, wake: r.dayStart - 90, sleep: 23 * 60, spans: false,
             text: toHM(r.dayStart) + "–" + toHM(r.dayEnd) };
  }
  const f = p.fixed;
  return { type: "work", label: "上班", workStart: f.workStart, workEnd: f.workEnd,
           lunchStart: f.lunchStart, lunchEnd: f.lunchEnd, wake: f.wake, sleep: f.sleep, spans: false,
           text: toHM(f.workStart) + "–" + toHM(f.workEnd) };
}
/* 谁的事：看句子开头有没有点名（"提醒妈妈买药"） */
function namePrefixRe(p) {
  if (!p || !p.name || p.name === "我") return null;
  const esc2 = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const alts = [p.name];
  if (p.name === "妈妈") alts.push("我妈", "母亲", "妈");
  if (p.name === "爸爸") alts.push("我爸", "父亲", "爸");
  if (p.name === "老婆") alts.push("媳妇", "妻子");
  if (p.name === "老公") alts.push("丈夫");
  return new RegExp("^(提醒|让|叫|催|帮)?\\s*(" + alts.map(esc2).join("|") + ")\\s*");
}
function whoFromText(text) {
  for (const p of state.people) {
    const re = namePrefixRe(p);
    if (re && re.test(text)) return p;
  }
  return null;
}
/* 和作息挂钩的锚点：AI 知道这个人今天几点上下班，「下班后」就不用你写时间了 */
function anchorsFor(s) {
  const list = [];
  if (s && s.workEnd != null) {
    list.push({ re: /下班后|下班以后|下了班|下班之后/, m: s.workEnd + 10, label: "下班后" });
    list.push({ re: /到家后|回家后|回到家用/, m: s.workEnd + 40, label: "到家后" });
  } else {
    list.push({ re: /下班后|下班以后|下了班|下班之后|到家后|回家后/, m: 10 * 60, label: "休息日，按白天的空档" });
  }
  if (s && s.workStart != null) list.push({ re: /上班前|上班之前|出门前/, m: s.workStart - 30, label: "上班前" });
  if (s && s.lunchStart != null) {
    list.push({ re: /午休|中午休息/, m: s.lunchStart, label: "午休" });
    list.push({ re: /午饭后|吃完午饭|午饭以后/, m: s.lunchEnd, label: "午饭后" });
  }
  list.push({ re: /晚饭后|吃完晚饭|饭后/, m: 19 * 60 + 30, label: "晚饭后" });
  list.push({ re: /早饭后|吃完早饭/, m: 7 * 60 + 30, label: "早饭后" });
  list.push({ re: /睡前|睡觉前|上床前/, m: (s ? s.sleep : 23 * 60) - 30, label: "睡前" });
  list.push({ re: /起床后|醒来后|早上起来|起床/, m: (s ? s.wake : 7 * 60) + 10, label: "起床后" });
  if (s && s.workEnd != null) list.push({ re: /下班/, m: s.workEnd, label: "下班" });
  return list;
}

function findDate(seg, base) {
  const b = new Date(base.getTime()); b.setHours(0, 0, 0, 0);
  if (/大后天/.test(seg)) return { d: addDays(b, 3), hit: /大后天/ };
  if (/后天/.test(seg)) return { d: addDays(b, 2), hit: /后天/ };
  if (/明天|明日|明儿|次日/.test(seg)) return { d: addDays(b, 1), hit: /明天|明日|明儿|次日/ };
  if (/今天|今日|今儿|今晚|今早/.test(seg)) return { d: b, hit: /今天|今日|今儿|今晚|今早/ };
  const w = seg.match(/(下下|下个|下|这|本)?(?:个)?(?:周|星期|礼拜)([一二三四五六日天])/);
  if (w) {
    const map = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 日: 0, 天: 0 };
    const tgt = map[w[2]];
    const dow = b.getDay();
    let delta = (tgt - dow + 7) % 7;
    if (/^下/.test(w[1] || "")) delta = delta === 0 ? 7 : delta + 7;
    if (w[1] === "下下") delta += 7;
    if (!w[1] && delta === 0) delta = 7; // 光说"周三"而今天就是周三 → 指下周三
    return { d: addDays(b, delta), hit: new RegExp(w[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&")) };
  }
  if (/周末/.test(seg)) {
    const delta = (6 - b.getDay() + 7) % 7 || 7;
    return { d: addDays(b, delta), hit: /周末/ };
  }
  const md = seg.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
  if (md) {
    const y = b.getFullYear();
    let d = new Date(y, +md[1] - 1, +md[2]);
    if (d.getTime() < b.getTime() - 86400000) d = new Date(y + 1, +md[1] - 1, +md[2]);
    return { d, hit: new RegExp(md[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&")) };
  }
  // 光说「15号」「每月1号」这种，找下一个该日
  const day = seg.match(/(\d{1,2}|[一二三四五六七八九十]{1,3})\s*[号日]/);
  if (day) {
    let dn = /^\d+$/.test(day[1]) ? +day[1] : cn2num(day[1]);
    const after = seg.charAt(day.index + day[0].length);
    if (dn >= 1 && dn <= 31 && !/[楼线店桌窗院栋区]/.test(after)) {
      let d = new Date(b.getFullYear(), b.getMonth(), dn);
      if (dn < b.getDate()) d = new Date(b.getFullYear(), b.getMonth() + 1, dn);
      return { d, hit: new RegExp(day[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&")) };
    }
  }
  return null;
}

function findClock(seg) {
  let m = seg.match(/(\d{1,2})\s*[:：]\s*(\d{1,2})/);
  if (m && +m[1] < 24 && +m[2] < 60) {
    let h = +m[1];
    const pre = seg.slice(Math.max(0, m.index - 2), m.index);
    if (/下午|傍晚|晚上|夜里/.test(pre) && h < 12) h += 12;
    return { h, mi: +m[2], idx: m.index, len: m[0].length, prefix: "" };
  }
  const re = /(凌晨|清晨|早上|早晨|一早|上午|中午|下午|傍晚|晚上|夜里|夜晚)?\s*(\d{1,2}|[一二三四五六七八九十两]{1,3})\s*[点時时]\s*(半|[0-5]?\d|[一二三四五六七八九十]{1,3}|一刻|三刻)?\s*分?/g;
  let mm, best = null;
  while ((mm = re.exec(seg))) {
    const prefix = mm[1] || "", hourRaw = mm[2], minRaw = mm[3] || "";
    let h = /^\d+$/.test(hourRaw) ? +hourRaw : cn2num(hourRaw);
    if (h == null || h > 24) continue;
    let mi = 0;
    if (minRaw === "半") mi = 30;
    else if (minRaw === "一刻") mi = 15;
    else if (minRaw === "三刻") mi = 45;
    else if (minRaw) { mi = /^\d+$/.test(minRaw) ? +minRaw : cn2num(minRaw); if (mi == null || mi > 59) mi = 0; }
    // 中文数字守卫：别把"一点盐""多点菜"当成时间
    if (!/^\d+$/.test(hourRaw) && !prefix && !minRaw) {
      const after = seg.charAt(mm.index + mm[0].length);
      if (after && /[儿盐糖油水醋菜品心点意思个事]/.test(after)) continue;
      const before = seg.charAt(mm.index - 1);
      if (before && /[多差快超]/.test(before)) continue;
    }
    if (/下午|傍晚|晚上|夜里|夜晚/.test(prefix) && h < 12) h += 12;
    if (/凌晨|清晨|早上|早晨|一早|上午/.test(prefix) && h === 12) h = 0;
    if (h === 24) h = 0;
    if (!best || mm.index < best.idx) best = { h, mi, idx: mm.index, len: mm[0].length, prefix };
  }
  return best;
}

function findRelative(seg, nowMin) {
  let m = seg.match(/([一二三四五六七八九十两\d]{1,3})\s*个?\s*小时后/);
  if (m) { const n = cn2num(m[1]); if (n) return { m: nowMin + n * 60, hit: m[0] }; }
  m = seg.match(/([一二三四五六七八九十两\d]{1,3})\s*分钟后/);
  if (m) { const n = cn2num(m[1]); if (n) return { m: nowMin + n, hit: m[0] }; }
  m = seg.match(/半个?小时后|半小时后/);
  if (m) return { m: nowMin + 30, hit: m[0] };
  m = seg.match(/一会儿|待会儿|待会|过会儿|等会儿|等会/);
  if (m) return { m: nowMin + 30, hit: m[0] };
  return null;
}

function findDuration(seg) {
  let m = seg.match(/([一二三四五六七八九十两\d]{1,3})\s*个?\s*小时/);
  if (m && !/小时(后|以后)/.test(seg.slice(m.index))) { const n = cn2num(m[1]); if (n) return n * 60; }
  m = seg.match(/([一二三四五六七八九十两\d]{1,3})\s*分钟/);
  if (m && !/分钟(后|以后)/.test(seg.slice(m.index))) { const n = cn2num(m[1]); if (n && n >= 5) return n; }
  if (/半个?小时/.test(seg) && !/半个?小时(后|以后)/.test(seg)) return 30;
  return null;   // 没说时长就交给"习惯"或分类默认值
}

/* 时间段：「下午3点到5点开会」→ 开始 15:00，时长 120 分钟 */
function findRange(seg) {
  const re = /(凌晨|清晨|早上|早晨|上午|中午|下午|傍晚|晚上|夜里)?\s*(\d{1,2}|[一二三四五六七八九十两]{1,3})\s*[点時时]\s*(半|[0-5]?\d)?[^\d一二三四五六七八九十]{0,2}(?:到|至|~|～|-|—|–)\s*(凌晨|清晨|早上|早晨|上午|中午|下午|傍晚|晚上|夜里)?\s*(\d{1,2}|[一二三四五六七八九十两]{1,3})\s*[点時时]\s*(半|[0-5]?\d)?/;
  const m = seg.match(re);
  if (!m) return null;
  const mk = (pre, hs, ms) => {
    let h = /^\d+$/.test(hs) ? +hs : cn2num(hs);
    if (h == null || h > 24) return null;
    if (h === 24) h = 0;
    const pm = /下午|傍晚|晚上|夜里/.test(pre || "");
    const am = /凌晨|清晨|早上|早晨|上午/.test(pre || "");
    if (pm && h < 12) h += 12;
    if (am && h === 12) h = 0;
    let mi = 0;
    if (ms === "半") mi = 30; else if (ms != null) mi = parseInt(ms, 10) || 0;
    return h * 60 + mi;
  };
  const a = mk(m[1] || seg.slice(Math.max(0, m.index - 2), m.index), m[2], m[3]);
  let b = mk(m[4], m[5], m[6]);
  if (a == null || b == null) return null;
  if (b <= a && !m[4] && b + 12 * 60 > a) b += 12 * 60;   // 「下午3点到5点」里的 5 点指 17 点
  if (b <= a) return null;
  return { start: a, dur: b - a };
}

/* 重复：「每天」「工作日」「周末」「每周三」「每月1号」 */
function findRepeat(seg) {
  if (/每天|天天|每日|每晚/.test(seg)) return "daily";
  if (/工作日|上班日|周一到周五|星期一到星期五/.test(seg)) return "weekday";
  if (/周末|周六日|星期六日|双休/.test(seg)) return "weekend";
  if (/每周|每星期|每礼拜/.test(seg)) return "weekly";
  if (/每月|每个月/.test(seg)) return "monthly";
  return "none";
}
function repeatName(r) {
  return r === "daily" ? "每天" : r === "weekday" ? "工作日" : r === "weekend" ? "周末"
    : r === "weekly" ? "每周" : r === "monthly" ? "每月" : "";
}

/* 从历史里学：同一类事记满 3 次以上、时间又不算散，就记住它 */
function learned(catKey) {
  const today = dk(new Date());
  const past = state.events.filter((e) => e.cat === catKey && e.date < today);
  if (past.length < 3) return null;
  const starts = past.map((e) => e.start).sort((a, b) => a - b);
  const durs = past.map((e) => e.dur).sort((a, b) => a - b);
  if (starts[starts.length - 1] - starts[0] > 210) return null;   // 时间太散，说明还没规律，别瞎猜
  const med = starts[Math.floor(starts.length / 2)];             // 用中位数，个别极端值带不偏
  return { start: Math.round(med / 5) * 5, dur: durs[Math.floor(durs.length / 2)], n: past.length };
}
function learnedHabits() {
  const rows = [];
  CATS.concat([DEFAULT_CAT]).forEach((c) => {
    const l = learned(c.key);
    if (l) rows.push(c.emoji + " " + c.key + " —— 一般 " + toHM(l.start) + "，约 " + l.dur + " 分钟（记过 " + l.n + " 次）");
  });
  return rows;
}

// 没写时间时，按"这个人当天的作息（可能是白班/夜班/休息）+ 以往习惯 + 事情种类"给一个合理时间
function guessByCategory(cat, s, nowMin) {
  const l = learned(cat.key);
  if (l) return { m: l.start, why: "按你以往的习惯（多在 " + toHM(l.start) + "）" };
  if (s && s.type === "night") {   // 夜班那天：饭要在上班前吃
    if (cat.key === "做饭") return { m: 16 * 60, why: "上夜班前先做" };
    if (cat.key === "吃饭") return { m: 17 * 60 + 30, why: "夜班前吃饭" };
  }
  const off = !s || s.workEnd == null;      // 休息日
  const we = off ? 10 * 60 : s.workEnd;     // 有班就以"下班"为基准
  const ws = (!s || s.workStart == null) ? 9 * 60 : s.workStart;
  const tag = off ? "休息日，" : "";
  switch (cat.key) {
    case "买菜": return { m: we + 10, why: tag + (off ? "白天去" : "下班顺路") };
    case "做饭": return { m: Math.max(17 * 60 + 30, we + 60), why: "到家后做饭" };
    case "吃饭": return { m: nowMin < 12 * 60 ? 12 * 60 : 18 * 60 + 30, why: "饭点" };
    case "工作": return { m: ws + 30, why: "上班后处理" };
    case "家人": return { m: we + 30, why: tag + "有空的时候" };
    case "运动": return { m: 19 * 60 + 30, why: "晚饭后活动" };
    case "健康": return { m: off ? 9 * 60 : ws + 60, why: tag + "白天办" };
    case "家务": return { m: 20 * 60, why: "晚上收拾" };
    case "事务": return { m: off ? 10 * 60 : ws + 60, why: tag + "白天办" };
    case "学习": return { m: 20 * 60, why: "晚上安静" };
    case "个人": return { m: 19 * 60, why: "晚饭后" };
    case "出行": return { m: we + 30, why: tag + "出发" };
    default: return { m: clamp(Math.ceil((nowMin + 30) / 30) * 30, 0, 23 * 60), why: "最近的一个整半点" };
  }
}

const FILLER = /记得|提醒我|提醒一下|提醒|别忘了|别忘记|不要忘了|我要|我想|帮我|给我|安排一下|安排|设置|添加到日程|加到日程|加进日程|放进日程|日程|然后|接着|一下子|一下|吧|哦|呀|呢|啊|嘛|，|。|,|\.|、|；|;/g;
function cleanTitle(seg, cutList) {
  let t = seg;
  cutList.forEach((r) => { if (r) t = t.replace(r, " "); });
  t = t.replace(FILLER, " ")
       .replace(TIMEISH, " ")
       .replace(/([一二三四五六七八九十两\d]{1,3})\s*个?\s*(小时|分钟)|半个?小时/g, " ")
       .replace(/每天|天天|每日|每晚|每周|每星期|每礼拜|每月|每个月/g, " ")
       .replace(/(^|\s)(到|至|每|~|～|-|—|–)(\s|$)/g, " ");
  t = t.replace(/[ \t\u3000]+/g, " ").trim();
  let prev;
  do { prev = t; t = t.replace(/([\u4e00-\u9fa5])\s+([\u4e00-\u9fa5])/g, "$1$2"); } while (t !== prev);
  t = t.replace(/^(我们|我|咱家|咱|你|您|家里)+/, "").trim();
  t = t.replace(/^[的了要就再去还没]+/, "").replace(/[的了]+$/, "").trim();
  return t;
}

/* 时间类词的总表：既用于切句判断"这句还剩什么内容"，也用于去噪 */
const TIMEISH = /(凌晨|清晨|早上|早晨|一早|上午|中午|下午|傍晚|晚上|夜里|夜晚|今天|今日|明天|明日|明儿|后天|大后天|工作日|周末|下班后|下班|上班前|上班|到家后|回家后|午休|午饭后|晚饭后|早饭后|睡前|睡觉前|起床后|醒来后|半小时后|半个小时后|一会儿|待会儿|待会|等会儿|等会|\d{1,2}\s*[:：]\s*\d{1,2}|[0-9一二三四五六七八九十两]{1,3}\s*[点時时]\s*(半|一刻|三刻|[0-9一二三四五六七八九十]{1,3})?|[一二三四五六七八九十两\d]{1,3}\s*个?\s*小时后|[一二三四五六七八九十两\d]{1,3}\s*分钟后|(下下|下个|下|这|本)?个?(周|星期|礼拜)[一二三四五六日天]|\d{1,2}\s*月\s*\d{1,2}\s*[日号]?)/g;
function coreOf(s) {
  return s.replace(FILLER, " ").replace(TIMEISH, " ").replace(/[的了要就再还有和与把给帮我的、,，。！!？?~～\s]/g, "").trim();
}

/* 把一句话切成多条（"买菜，然后做饭"） */
function splitSegments(text) {
  const parts = text.split(/[，,；;]|然后|接着|之后|完了再|再/).map((s) => s.trim()).filter(Boolean);
  const out = [];
  let carry = "";
  for (const p of parts) {
    if (coreOf(p).length < 2) { carry += p; continue; }   // "我下班后记得提醒我" 这类只带时间不含事情，并入下一句
    out.push(carry + p); carry = "";
  }
  if (carry) { if (out.length) out[out.length - 1] += carry; else out.push(carry); }
  return out.length ? out : [text];
}

/* ============================== 主解析函数 ============================== */
function parseInput(raw) {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const text = raw.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 65248)).trim();
  const segs = splitSegments(text);
  const items = [];
  const halal = halalCheck(text);
  const fallbackWho = currentPerson();

  segs.forEach((seg, i) => {
    const cat = detectCat(seg);
    const cutList = [];
    const segWho = whoFromText(seg) || fallbackWho;   // 「提醒妈妈买药」→ 算在妈妈头上
    const npRe = namePrefixRe(segWho);
    if (npRe && npRe.test(seg)) cutList.push(npRe);
    let date = findDate(seg, now);
    if (date) cutList.push(date.hit);
    // 先确定是哪一天，才知道这个人那天上什么班
    const sched = personOn(segWho, dk(date ? date.d : now));
    let startMin = null, why = "";
    const rel = findRelative(seg, nowMin);
    const clock = findClock(seg);
    const anc = anchorsFor(sched).find((a) => a.re.test(seg));
    const range = findRange(seg);   // 「下午3点到5点」给的是时长
    const rep = findRepeat(seg);    // 「每天」「每周三」「每月1号」

    if (clock) { startMin = clock.h * 60 + clock.mi; why = "你指定的时间"; cutList.push(new RegExp(seg.substr(clock.idx, clock.len).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))); }
    else if (rel) { startMin = rel.m; why = "从现在往后算"; cutList.push(new RegExp(rel.hit)); if (!date) date = { d: new Date(now.getFullYear(), now.getMonth(), now.getDate()), hit: null }; }
    else if (anc) { startMin = anc.m; why = anc.label + "（按你设的作息）"; cutList.push(anc.re); }
    else {
      const per = PERIODS.find((x) => x.re.test(seg));
      if (per) { startMin = per.h; why = "按习惯放在这个时段"; cutList.push(per.re); }
      else { const g = guessByCategory(cat, sched, nowMin); startMin = g.m; why = g.why; }
    }

    let dateObj = date ? date.d : new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let dur = range ? range.dur : findDuration(seg);
    if (dur == null) { const lr = learned(cat.key); dur = lr ? lr.dur : cat.dur; }
    let title = cleanTitle(seg, cutList);
    if (!title) title = cat.key === "其他" ? "待办" : cat.key;
    if (i > 0 && !clock && !rel && !anc) {
      startMin = items[i - 1].startMin + items[i - 1].dur + 15;
      dateObj = fromKey(items[i - 1].dateKey);
      date = { d: dateObj, hit: null };   // 跟在上一件事之后，也跟它同一天
      why = "接在上一件事之后";
    }
    if (startMin >= 24 * 60) { startMin -= 24 * 60; dateObj = addDays(dateObj, 1); }

    // 工作日/周末的固定提醒，第一次要落在对的日子上（周六建的工作日提醒直接落到周一）
    if (rep === "weekday" || rep === "weekend") {
      const dw = dateObj.getDay(), isWk = dw === 0 || dw === 6;
      if (rep === "weekday" && isWk) dateObj = addDays(dateObj, dw === 6 ? 2 : 1);
      if (rep === "weekend" && !isWk) dateObj = addDays(dateObj, 6 - dw);
    }
    // 固定提醒如果今天这个点已经过了，就从下一次开始，别在今天摆一条已经过去的
    if (rep !== "none" && !date && dk(dateObj) === dk(now) && startMin < nowMin) {
      dateObj = addDays(dateObj, 1);
      const dw2 = dateObj.getDay();
      if (rep === "weekday" && (dw2 === 0 || dw2 === 6)) dateObj = addDays(dateObj, dw2 === 6 ? 2 : 1);
      if (rep === "weekend" && dw2 !== 0 && dw2 !== 6) dateObj = addDays(dateObj, 6 - dw2);
    }

    // 时间已经过去、而且没说哪一天 → 顺延到明天。明天可能是另一个班，得按明天的作息重算一遍
    let rolled = false;
    const sameDay = dk(dateObj) === dk(now);
    if (sameDay && startMin < nowMin - 5 && !date && rep === "none") {
      dateObj = addDays(dateObj, 1); rolled = true;
      if (!clock && !rel) {
        const s2 = personOn(segWho, dk(dateObj));
        const a2 = anchorsFor(s2).find((a) => a.re.test(seg));
        if (anc && a2) { startMin = a2.m; why = a2.label + "（按明天的作息）"; }
        else { const g2 = guessByCategory(cat, s2, nowMin); startMin = g2.m; why = g2.why; }
        if (startMin >= 24 * 60) { startMin -= 24 * 60; dateObj = addDays(dateObj, 1); }
      }
    }
    if (sameDay && startMin < nowMin - 5 && date && !clock && !rel) {
      startMin = clamp(Math.ceil((nowMin + 20) / 10) * 10, 0, 23 * 60 + 30); rolled = false;
    }
    const key = dk(dateObj);
    const slot = findFreeSlot(key, startMin, dur, null);
    items.push({
      title, cat, dateKey: key, startMin: slot.start, dur, why, who: segWho.id,
      moved: slot.moved, blocker: slot.blocker ? slot.blocker.title : "",
      rolled, note: "", repeat: rep,
      repeatUntil: rep === "none" ? null : dk(addDays(fromKey(key), 120))
    });
  });

  return { items, halal, segments: segs };
}

/* ============================== 排期避让 ============================== */
/* 重复日程不预先展开成几百条，看哪天就现算哪天 */
function occurrenceOf(e, key) {
  if (!e.repeat || e.repeat === "none") return e.date === key;
  if (key < e.date) return false;
  if (e.repeatUntil && key > e.repeatUntil) return false;
  if ((e.skip || []).indexOf(key) >= 0) return false;
  const a = fromKey(e.date), b = fromKey(key);
  const diff = Math.round((b.getTime() - a.getTime()) / 86400000);
  if (e.repeat === "daily") return diff >= 0;
  if (e.repeat === "weekday") return b.getDay() >= 1 && b.getDay() <= 5;
  if (e.repeat === "weekend") return b.getDay() === 0 || b.getDay() === 6;
  if (e.repeat === "weekly") return diff % 7 === 0;
  if (e.repeat === "monthly") return a.getDate() === b.getDate();
  return false;
}
function eventsOn(key) {
  const out = [];
  for (const e of state.events) {
    if (!occurrenceOf(e, key)) continue;
    const occ = Object.assign({}, e, { occ: key });
    if (e.repeat && e.repeat !== "none") occ.done = (e.doneDates || []).indexOf(key) >= 0;
    out.push(occ);
  }
  return out.sort((x, y) => x.start - y.start);
}
function findFreeSlot(key, startMin, dur, ignoreId) {
  const evs = eventsOn(key).filter((e) => e.id !== ignoreId);
  let cur = clamp(startMin, 0, 23 * 60 + 30), moved = false, blocker = null, guard = 0;
  while (guard++ < 80) {
    const end = cur + dur;
    const hit = evs.find((e) => cur < e.start + e.dur - 1 && e.start < end - 1);
    if (!hit) break;
    if (!moved) blocker = hit;
    moved = true;
    cur = hit.start + hit.dur + 5;
    if (cur > 23 * 60 + 30) { cur = 8 * 60; break; }
  }
  return { start: cur, moved, blocker };
}

/* ============================== 应用解析结果 ============================== */
function applyParsed(parsed, echo) {
  const n = parsed.items.length;
  const added = [];
  parsed.items.forEach((it) => {
    const e = {
      id: uid(), date: it.dateKey, start: it.startMin, dur: it.dur,
      title: it.title, note: it.note || "", cat: it.cat.key, done: false, created: Date.now(),
      who: it.who || state.currentPerson
    };
    if (it.repeat && it.repeat !== "none") {
      e.repeat = it.repeat; e.repeatUntil = it.repeatUntil; e.skip = []; e.doneDates = [];
    }
    state.events.push(e);
    added.push(e);
  });
  saveState(); render();
  const last = added[added.length - 1];
  let msg = n > 1 ? "安排好了 " + n + " 件事" : "已安排：" + last.title;
  msg += " · " + dayShort(last.date) + " " + toHM(last.start);
  if (parsed.items[0].why) msg += "（" + parsed.items[0].why + "）";
  if (parsed.items.some((x) => x.moved)) {
    const m = parsed.items.find((x) => x.moved);
    msg = "已避开「" + m.blocker + "」，改到 " + toHM(m.start);
  }
  if (parsed.items.some((x) => x.rolled)) msg += "（这个点已经过了，排到明天）";
  if (parsed.items.some((x) => x.repeat && x.repeat !== "none")) {
    const r = parsed.items.find((x) => x.repeat && x.repeat !== "none");
    msg += "，以后" + repeatName(r.repeat) + "都提醒";
  }
  toast(msg);
  if (parsed.halal.length) {
    const h = parsed.halal.find((x) => x.level === "block") || parsed.halal[0];
    setTimeout(() => toast((h.level === "block" ? "⚠️ 提醒：" : "ℹ️ 注意：") + h.why + "，" + h.fix), 2700);
  }
  if (echo) $("#nlInput").value = "";
}
function dayShort(key) {
  const t = dk(new Date());
  if (key === t) return "今天";
  if (key === dk(addDays(new Date(), 1))) return "明天";
  if (key === dk(addDays(new Date(), 2))) return "后天";
  const d = fromKey(key);
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + WEEK[d.getDay()];
}

/* ============================== 常识轮换 ============================== */
/* 家里人爱吃，饮食烹饪类的小常识抽中概率给高一点（权重 2） */
const FOOD_TIP_RE = /炒|煮|蒸|炖|煎|炸|烤|锅|油|盐|糖|醋|米|面|蛋|肉|菜|汤|冰箱|食材|豆浆|土豆|蒜|姜|葱|水果|砧板|焯|炖/;
function tipPool() {
  const pool = [];
  TIPS.forEach((t, i) => {
    if (state.seenTips.indexOf(i) >= 0) return;
    const w = FOOD_TIP_RE.test(t) ? 2 : 1;
    for (let k = 0; k < w; k++) pool.push(i);
  });
  return pool;
}
function nextTip(force) {
  if (!state.seenTips) state.seenTips = [];
  let pool = tipPool();
  if (!pool.length) { state.seenTips = []; pool = tipPool(); }
  const idx = pool[Math.floor(Math.random() * pool.length)];
  state.seenTips.push(idx);
  if (state.seenTips.length > TIPS.length - 6) state.seenTips = state.seenTips.slice(-6);
  if (force) saveState();
  return TIPS[idx];
}

let viewKey = dk(new Date());
const CATMAP = {}; CATS.forEach((c) => (CATMAP[c.key] = c)); CATMAP[DEFAULT_CAT.key] = DEFAULT_CAT;
function catOf(key) { return CATMAP[key] || DEFAULT_CAT; }

function render() {

  renderList();

  renderShopBadge();
}

      '<div class="cbody">' +
        '<div class="ctitle"><span class="cnum" style="background:' + c.color + '1f;color:' + c.color + '">' + numBadge(i) + '</span>' + esc(e.title) + '</div>' +
        '<div class="cmeta"><span class="tag cat">' + c.emoji + ' ' + c.key + '</span><span class="tag">' + e.dur + ' 分钟</span>' + whoTag + rep + '</div>' +
        (e.note ? '<div class="cnote">' + esc(e.note) + '</div>' : "") +
      '</div>' +
      '<div class="cops">' +
        '<button data-act="done" data-id="' + e.id + '" data-occ="' + e.occ + '" title="完成">' + (e.done ? "↩" : "✓") + '</button>' +

      '</div></div>';
  }).join("");
}
/* 编号：①②③… 让列表和横轴上的位置对得上 */
function numBadge(i) {
  const N = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
  return i < N.length ? N.charAt(i) : String(i + 1);
}
/* 一天的时间分布：上午 00–12 一条、下午 12–24 一条，编号用引线指到轴上
   分成两条之后同一个宽度表示 12 小时而不是 24 小时，点起来准得多 */
function renderTimeline() {
  const box = $("#tl");
  const evs = eventsOn(viewKey);
  const isToday = viewKey === dk(new Date());
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const HALVES = [{ from: 0, to: 720 }, { from: 720, to: 1440 }];
  let html = "";
  HALVES.forEach((h) => {
    // 编号：算在自己开始的那半段上方，挨太近的错开一行
    const mine = [];
    evs.forEach((e, i) => {
      if (e.start < h.from || e.start >= h.to) return;
      mine.push({ e: e, i: i, p: clamp(((e.start - h.from) / 720) * 100, 3, 97), lane: 0 });
    });
    let lastP = -99, lane = 0;
    mine.forEach((m) => {
      lane = (m.p - lastP < 9) ? (lane === 0 ? 1 : 0) : 0;
      lastP = m.p;
      m.lane = lane;
    });
    const marksH = mine.some((m) => m.lane === 1) ? 48 : 26;
    let row = '<div class="hmarks" style="height:' + marksH + 'px">';
    mine.forEach((m) => {
      const c = catOf(m.e.cat);
      const top = m.lane === 1 ? 22 : 0;
      row += '<span class="hnum" data-id="' + m.e.id + '" style="left:' + m.p.toFixed(2) + '%;top:' + top + 'px;background:' + c.color + '1f;color:' + c.color + '">' + numBadge(m.i) + '</span>' +
             '<span class="hstem" style="left:' + m.p.toFixed(2) + '%;top:' + (top + 18) + 'px;height:' + (marksH - top - 18) + 'px"></span>';
    });
    if (!evs.length && h.from === 0) row += '<div class="hempty">还没有安排，点这两条线就能加</div>';
    row += '</div>';
    // 轨道 + 每 3 小时一条参考线（两端的 00 和 12 由轨道边缘表示）
    row += '<div class="htrack" data-from="' + h.from + '">';
    [180, 360, 540].forEach((off) => {
      row += '<span class="hgrid" style="left:' + ((off / 720) * 100) + '%"></span>';
    });
    evs.forEach((e) => {
      const s = Math.max(e.start, h.from), en = Math.min(e.start + e.dur, h.to);
      if (en <= s) return;   // 跨中午的会拆成两段，两条轴上各画一半
      const c = catOf(e.cat);
      const l = ((s - h.from) / 720) * 100;
      const w = Math.max(0.9, ((en - s) / 720) * 100);
      row += '<span class="hseg" data-id="' + e.id + '" title="' + esc(toHM(e.start) + " " + e.title) + '" style="left:' + l.toFixed(3) + '%;width:' + Math.min(w, 100 - l).toFixed(3) + '%;background:' + c.color + (e.done ? "59" : "cc") + '"></span>';
    });
    if (isToday && nowMin >= h.from && nowMin < h.to) {
      row += '<span class="hnow" style="left:' + (((nowMin - h.from) / 720) * 100).toFixed(2) + '%"></span>';
    }
    row += '</div>';
    row += '<div class="hticks">' +
      [0, 180, 360, 540, 720].map((off) => {
        const total = h.from + off;
        return '<span style="left:' + ((off / 720) * 100) + '%">' + (total === 1440 ? "24" : pad(total / 60)) + '</span>';
      }).join("") + '</div>';
    html += '<div class="hblock">' + row + '</div>';
  });
  box.innerHTML = html;
  const hint = $("#tlHint");
  if (hint) hint.textContent = (isToday ? "现在 " + toHM(nowMin) + " · " : "") + "点线或编号就能改";
}
function renderShopBadge() {
  const left = state.shop.filter((s) => !s.done).length;
  const b = $("#shopBadge");
  b.textContent = left;
  b.classList.toggle("hidden", left === 0);
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ============================== 弹层 ============================== */
function openSheet(title, html, after) {
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = html;
  $("#sheet").classList.add("on");
  $("#mask").classList.remove("hidden");
  requestAnimationFrame(() => $("#mask").classList.add("on"));
  if (after) after();
}
function closeSheet() {
  $("#sheet").classList.remove("on");
  $("#mask").classList.remove("on");
  setTimeout(() => $("#mask").classList.add("hidden"), 220);
}

          $("#impGo").onclick = () => {

              saveState(); render(); closeSheet(); toast("已恢复 " + state.events.length + " 条日程");
            } catch (err) { toast("这段文本读不出来，确认是完整复制过来的"); }
          };
        });
      };
      $("#setClear").onclick = () => {
        if (confirm("确定清空所有日程吗？这一步不能撤销。")) {
          state.events = []; state.shop = []; saveState(); render(); closeSheet(); toast("已清空");
        }
      };
    });
}

/* ---------- 修改某个人的作息（固定班 / 轮班） ---------- */
function rotatePreviewHtml(cycle, anchor, ds, de, ns, ne) {
  const cyc = (cycle || "白夜休").split("").map((ch) => SHIFT_CHAR[ch] || "off");
  const a = fromKey(anchor || dk(new Date()));
  const rows = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(new Date(), i);
    const diff = Math.round((fromKey(dk(d)).getTime() - a.getTime()) / 86400000);
    const t = cyc[((diff % cyc.length) + cyc.length) % cyc.length];
    const txt = t === "day" ? "白班 " + ds + "–" + de : t === "night" ? "夜班 " + ns + "–次晨 " + ne : "休息";
    const head = i === 0 ? "今天" : i === 1 ? "明天" : i === 2 ? "后天" : (d.getMonth() + 1) + "/" + d.getDate();
    rows.push(head + " " + WEEK[d.getDay()] + " · " + txt);
  }
  return rows.join("<br>");
}
function openPerson(id) {
  const p = state.people.find((x) => x.id === id);
  if (!p) return;
  const isRot = p.mode === "rotate";
  const f = Object.assign({ workStart: 9 * 60, workEnd: 18 * 60, lunchStart: 12 * 60, lunchEnd: 13 * 60, wake: 7 * 60, sleep: 23 * 60 }, p.fixed || {});
  const r = Object.assign({ cycle: "白夜休", anchor: dk(new Date()), dayStart: 8 * 60, dayEnd: 18 * 60, nightStart: 18 * 60, nightEnd: 8 * 60 }, p.rotate || {});
  const fld = (title, fid, val) => '<div><label>' + title + '</label><input type="time" id="' + fid + '" value="' + val + '"></div>';
  openSheet("修改作息 · " + esc(p.name),
    '<div class="frow"><label>称呼</label><input id="pName" value="' + esc(p.name) + '" placeholder="例如：爸爸"></div>' +
    '<div class="frow"><label>哪种作息</label><select id="pMode">' +
      '<option value="fixed"' + (isRot ? "" : " selected") + '>固定班（每天都一样）</option>' +
      '<option value="rotate"' + (isRot ? " selected" : "") + '>轮班（白班 / 夜班 / 休息轮着来）</option>' +
    '</select></div>' +
    '<div id="fixBlock"' + (isRot ? ' class="hidden"' : "") + '>' +
      '<div class="frow two">' + fld("上班", "pWs", toHM(f.workStart)) + fld("下班", "pWe", toHM(f.workEnd)) + '</div>' +
      '<div class="frow two">' + fld("午休开始", "pLs", toHM(f.lunchStart)) + fld("午休结束", "pLe", toHM(f.lunchEnd)) + '</div>' +
      '<div class="frow two">' + fld("起床", "pWake", toHM(f.wake)) + fld("睡觉", "pSleep", toHM(f.sleep)) + '</div>' +
    '</div>' +
    '<div id="rotBlock"' + (isRot ? "" : ' class="hidden"') + '>' +
      '<div class="frow"><label>轮班规律（一天一个字：白＝白班，夜＝夜班，休＝休息）</label>' +
        '<input id="pCycle" value="' + esc(r.cycle) + '" placeholder="白夜休">' +
        '<div class="presets"><button class="mini" data-cyc="白夜休">白夜休</button>' +
        '<button class="mini" data-cyc="白休夜休">白休夜休</button>' +
        '<button class="mini" data-cyc="白白夜休休">白白夜休休</button></div></div>' +
      '<div class="frow two">' + fld("白班开始", "pDs", toHM(r.dayStart)) + fld("白班结束", "pDe", toHM(r.dayEnd)) + '</div>' +
      '<div class="frow two">' + fld("夜班开始", "pNs", toHM(r.nightStart)) + fld("夜班结束（次日早上）", "pNe", toHM(r.nightEnd)) + '</div>' +
      '<div class="frow"><label>哪一天是白班（用来对准轮次，选错会整天错开）</label>' +
        '<input type="date" id="pAnchor" value="' + r.anchor + '">' +
        '<div class="presets"><button class="mini" data-anch="0">今天是白班</button>' +
        '<button class="mini" data-anch="-1">昨天是白班</button>' +
        '<button class="mini" data-anch="1">明天是白班</button></div></div>' +
      '<div class="note"><b>接下来七天，对着日历核一下：</b><br><span id="rotPreview"></span></div>' +
    '</div>' +
    '<div style="height:12px"></div>' +
    '<button class="btn" id="pSave">保存</button>' +
    (state.people.length > 1 ? '<button class="btn danger" id="pDel">删掉这个人</button>' : ''),
    () => {
      const readHM = (fid, dflt) => {
        const el = $("#" + fid);
        if (!el || !el.value || el.value.indexOf(":") < 0) return dflt;
        const a = el.value.split(":");
        return (+a[0]) * 60 + (+a[1]);
      };
      const refresh = () => {
        const el = $("#rotPreview");
        if (!el) return;
        el.innerHTML = rotatePreviewHtml($("#pCycle").value, $("#pAnchor").value,
          $("#pDs").value || "08:00", $("#pDe").value || "18:00", $("#pNs").value || "18:00", $("#pNe").value || "08:00");
      };
      $("#pMode").onchange = () => {
        const m = $("#pMode").value;
        $("#fixBlock").classList.toggle("hidden", m !== "fixed");
        $("#rotBlock").classList.toggle("hidden", m !== "rotate");
        refresh();
      };
      ["pCycle", "pAnchor", "pDs", "pDe", "pNs", "pNe"].forEach((fid) => {
        const el = $("#" + fid);
        if (el) { el.oninput = refresh; el.onchange = refresh; }
      });
      $("#sheetBody").querySelectorAll("[data-cyc]").forEach((b) => {
        b.onclick = () => { $("#pCycle").value = b.dataset.cyc; refresh(); };
      });
      $("#sheetBody").querySelectorAll("[data-anch]").forEach((b) => {
        b.onclick = () => { $("#pAnchor").value = dk(addDays(new Date(), +b.dataset.anch)); refresh(); };
      });
      refresh();
      $("#pSave").onclick = () => {
        p.name = $("#pName").value.trim() || p.name;
        p.mode = $("#pMode").value;
        if (p.mode === "fixed") {
          p.fixed = {
            workStart: readHM("pWs", f.workStart), workEnd: readHM("pWe", f.workEnd),
            lunchStart: readHM("pLs", f.lunchStart), lunchEnd: readHM("pLe", f.lunchEnd),
            wake: readHM("pWake", f.wake), sleep: readHM("pSleep", f.sleep)
          };
          delete p.rotate;
        } else {
          let cyc = ($("#pCycle").value || "").split("").filter((ch) => "白夜休".indexOf(ch) >= 0).join("");
          if (!cyc) cyc = "白夜休";
          p.rotate = {
            cycle: cyc, anchor: $("#pAnchor").value || dk(new Date()),
            dayStart: readHM("pDs", r.dayStart), dayEnd: readHM("pDe", r.dayEnd),
            nightStart: readHM("pNs", r.nightStart), nightEnd: readHM("pNe", r.nightEnd)
          };
          delete p.fixed;
        }
        saveState(); render(); closeSheet();
        const s = personOn(p, viewKey);
        toast(p.name + "：" + dayShort(viewKey) + "是" + s.label + (s.text ? " " + s.text : ""));
      };
      if ($("#pDel")) $("#pDel").onclick = () => {
        if (confirm("删掉「" + p.name + "」？TA 名下的日程会保留，只是不再归属到人。")) {
          state.people = state.people.filter((x) => x.id !== p.id);
          if (state.currentPerson === p.id) state.currentPerson = state.people[0].id;
          saveState(); render(); openSettings();
        }
      };
    });
}

/* ---------- 编辑/新建单条 ---------- */
function openEdit(id, preset) {
  const isNew = !id;
  const e = isNew ? Object.assign({ id: uid(), date: viewKey, start: 9 * 60, dur: 30, title: "", note: "", cat: "其他", done: false, repeat: "none" }, preset || {})
                   : state.events.find((x) => x.id === id);
  if (!e) return;
  const repSel = [["none", "不重复"], ["daily", "每天"], ["weekday", "工作日（周一到周五）"],
    ["weekend", "周末（周六日）"], ["weekly", "每周"], ["monthly", "每月"]]
    .map((p) => '<option value="' + p[0] + '"' + ((e.repeat || "none") === p[0] ? " selected" : "") + '>' + p[1] + '</option>').join("");
  const repNote = (!isNew && e.repeat && e.repeat !== "none")
    ? '<div class="note warn">这是' + repeatName(e.repeat) + '的重复安排，改这里会影响以后的每一次。</div><div style="height:10px"></div>' : "";
  openSheet(isNew ? "新建安排" : "修改安排",
    repNote +
    '<div class="frow"><label>要做什么</label><input id="eTitle" value="' + esc(e.title) + '" placeholder="例如：买菜"></div>' +
    '<div class="frow two"><div><label>日期</label><input type="date" id="eDate" value="' + e.date + '"></div><div><label>开始</label><input type="time" id="eStart" value="' + toHM(e.start) + '"></div></div>' +
    '<div class="frow two"><div><label>时长（分钟）</label><input type="number" id="eDur" min="5" step="5" value="' + e.dur + '"></div>' +
    '<div><label>分类</label><select id="eCat">' + CATS.concat([DEFAULT_CAT]).map((c) => '<option value="' + c.key + '"' + (c.key === e.cat ? " selected" : "") + '>' + c.emoji + " " + c.key + '</option>').join("") + '</select></div></div>' +
    '<div class="frow two"><div><label>归谁</label><select id="eWho">' + state.people.map((p) => '<option value="' + p.id + '"' + (p.id === (e.who || state.currentPerson) ? " selected" : "") + '>' + esc(p.name) + '</option>').join("") + '</select></div>' +
    '<div><label>重复</label><select id="eRepeat">' + repSel + '</select></div></div>' +
    '<div class="frow"><label>备注（买菜清单、菜名都能写这）</label><textarea id="eNote" placeholder="例如：青椒、土豆、鸡蛋">' + esc(e.note) + '</textarea></div>' +
    '<button class="btn" id="eSave">保存</button>' +
    (isNew ? "" : '<button class="btn danger" id="eDel">删除这条</button>'),
    () => {
      $("#eSave").onclick = () => {
        const h = $("#eStart").value.split(":");
        e.title = $("#eTitle").value.trim() || "待办";
        e.date = $("#eDate").value || viewKey;
        e.start = (+h[0]) * 60 + (+h[1]);
        e.dur = clamp(parseInt($("#eDur").value, 10) || 30, 5, 600);
        e.cat = $("#eCat").value;
        e.note = $("#eNote").value.trim();
        if ($("#eWho")) e.who = $("#eWho").value;
        const rp = $("#eRepeat").value;
        if (rp === "none") { delete e.repeat; delete e.repeatUntil; e.skip = []; e.doneDates = []; }
        else { e.repeat = rp; e.repeatUntil = dk(addDays(fromKey(e.date), 120)); e.skip = e.skip || []; e.doneDates = e.doneDates || []; }
        if (isNew) state.events.push(e);
        viewKey = e.date;
        saveState(); render(); closeSheet();
        const hl = halalCheck(e.title + " " + e.note);
        if (hl.length) { const h2 = hl[0]; toast((h2.level === "block" ? "⚠️ " : "ℹ️ ") + h2.why + "，" + h2.fix); }
      };
      if (!isNew) $("#eDel").onclick = () => {
        if (e.repeat && e.repeat !== "none") { askDeleteRepeat(e, e.date); return; }
        state.events = state.events.filter((x) => x.id !== e.id);
        saveState(); render(); closeSheet(); toast("已删除");
      };
    });
}

/* ---------- 今天吃什么 ---------- */
function pool(kinds, recent) {
  const all = [];
  DISHES.forEach((d, i) => { if (kinds.indexOf(d[4]) >= 0) all.push(i); });
  const fresh = all.filter((i) => recent.indexOf(i) < 0);
  return fresh.length >= 3 ? fresh : all;
}
function dishCard(i, role) {
  const d = DISHES[i];
  return '<div class="dish" data-i="' + i + '">' +
    '<div class="dh"><span class="dn">' + esc(d[0]) + '</span><span class="dk">' + role + '</span></div>' +
    '<div class="dt"><span class="tag">⏱ ' + d[2] + ' 分钟</span><span class="tag">' + "★".repeat(d[3]) + "☆".repeat(3 - d[3]) + '</span>' + d[1].split(" ").map((t) => '<span class="tag">' + esc(t) + '</span>').join("") + '</div>' +
    '<div class="di">🧺 ' + esc(d[5].split(" ").join(" · ")) + '</div>' +
    '<div class="ds">' + esc(d[6]) + '</div>' +
    '<div class="dops"><button class="p" data-d="plan">安排做这道</button><button data-d="shop">食材进清单</button><button data-d="reroll">换一道</button></div>' +
    '</div>';
}
let eatSet = null;
let eatForm = null;   // null = 一荤一素一汤的搭配模式；选了就是"换个花样"按做法挑
const EAT_FORMS = ["一锅出", "烤箱菜", "蒸/白灼", "凉拌/现成", "炖菜", "汤", "面点主食", "家常炒"];
/* 看出这道菜是"怎么做的"，用来解决"又想不出吃什么" */
function formOf(i) {
  const d = DISHES[i], s = d[0] + " " + d[6];
  if (/焖饭|焖面|一锅出|饭包|乱炖|火锅/.test(s)) return "一锅出";
  if (/烤箱|烤/.test(s)) return "烤箱菜";
  if (/蒸|白灼/.test(s)) return "蒸/白灼";
  if (/凉拌|不用开火|手撕鸡|老虎菜|蘸酱/.test(s)) return "凉拌/现成";
  if (d[4] === "汤") return "汤";
  if (d[4] === "主食") return "面点主食";
  if (/炖|煲|砂锅/.test(s)) return "炖菜";
  return "家常炒";
}
function dishesOfForm(f) {
  const out = [];
  DISHES.forEach((d, i) => { if (formOf(i) === f) out.push(i); });
  return out;
}
function newEatSet() {
  const recent = state.seenDishes || [];
  if (eatForm) {
    const all = dishesOfForm(eatForm);
    const fresh = all.filter((i) => recent.indexOf(i) < 0);
    const src = fresh.length >= 3 ? fresh : all;
    const picked = [];
    for (let k = 0; k < 3 && picked.length < src.length; k++) {
      let idx, guard = 0;
      do { idx = src[Math.floor(Math.random() * src.length)]; guard++; } while (picked.indexOf(idx) >= 0 && guard < 60);
      if (picked.indexOf(idx) < 0) picked.push(idx);
    }
    return picked;
  }
  const pick = (kinds) => { const a = pool(kinds, recent); return a[Math.floor(Math.random() * a.length)]; };
  return [pick(["荤", "海鲜"]), pick(["素"]), pick(["汤", "主食"])];
}
function rerollCandidates(old) {
  if (eatForm) {
    const all = dishesOfForm(eatForm).filter((x) => x !== old);
    const fresh = all.filter((x) => (state.seenDishes || []).indexOf(x) < 0);
    return fresh.length ? fresh : all;
  }
  return pool(kindPoolOf(old), (state.seenDishes || []).concat([old])).filter((x) => x !== old);
}
function kindPoolOf(i) {
  const k = DISHES[i][4];
  return k === "素" ? ["素"] : (k === "荤" || k === "海鲜") ? ["荤", "海鲜"] : ["汤", "主食"];
}
function roleOf(i) {
  const k = DISHES[i][4];
  if (eatForm) return k;
  return k === "素" ? "素菜" : (k === "汤" || k === "主食") ? "汤/主食" : "主菜";
}
function openEat() {
  if (!eatSet) eatSet = newEatSet();
  const formChips = '<div class="chips formchips">' +
    '<button class="chip' + (eatForm ? "" : " hi") + '" data-form="">🍱 三菜搭配</button>' +
    EAT_FORMS.map((f) => '<button class="chip' + (eatForm === f ? " hi" : "") + '" data-form="' + f + '">' + f + '</button>').join("") +
    '</div>';
  const html =
    formChips +
    '<div class="sethead">' + (eatForm
      ? '换个花样吃：<b>' + esc(eatForm) + '</b> · 挑了三道 · 全部不含猪肉、猪油、料酒'
      : '给你配好一套：一荤 + 一素 + 一汤/主食 · 全部不含猪肉、猪油、料酒') + '</div>' +
    eatSet.map((i) => dishCard(i, roleOf(i))).join("") +
    '<button class="btn" id="eatReroll">🔄 换一批</button>' +
    '<div style="height:10px"></div>' +
    '<button class="btn ghost" id="eatAllShop">把这几个的食材都加进买菜清单</button>' +
    '<div style="height:14px"></div>' +
    '<div class="note">「火锅、烤肉吃腻了」的时候点上面那排：换的是一类做法，不只是换菜名。<br>肉类记得按家里的习惯选清真认证的；香肠、肉丸、火锅底料这类加工品，买前看一眼清真标识。</div>';
  openSheet("今天吃什么（清真家常）", html, () => {
    $("#sheetBody").querySelectorAll("[data-form]").forEach((b) => {
      b.onclick = () => { eatForm = b.dataset.form || null; eatSet = newEatSet(); openEat(); };
    });
    const cards = $("#sheetBody").querySelectorAll(".dish");
    for (let n = 0; n < cards.length; n++) {
      const el = cards[n], slot = n;
      el.querySelectorAll("button").forEach((b) => {
        b.onclick = () => {
          const act = b.dataset.d;
          if (act === "plan") planDish(eatSet[slot]);
          else if (act === "shop") { addShop(DISHES[eatSet[slot]][5].split(" ")); toast("食材已进买菜清单"); }
          else if (act === "reroll") {
            const cand = rerollCandidates(eatSet[slot]);
            if (cand.length) eatSet[slot] = cand[Math.floor(Math.random() * cand.length)];
            openEat();
          }
        };
      });
    }
    $("#eatReroll").onclick = () => {
      state.seenDishes = (state.seenDishes || []).concat(eatSet).slice(-40);
      saveState(); eatSet = newEatSet(); openEat();
    };
    $("#eatAllShop").onclick = () => { eatSet.forEach((i) => addShop(DISHES[i][5].split(" "))); toast("食材都进清单了"); };
  });
}
function planDish(i) {
  const d = DISHES[i];
  const s = personOn(currentPerson(), dk(new Date()));
  const we = s.workEnd == null ? 16 * 60 : s.workEnd;
  const when = clamp(Math.max(17 * 60 + 30, we + 60), 0, 22 * 60);
  const key = dk(new Date());
  const slot = findFreeSlot(key, when, 60, null);
  state.events.push({
    id: uid(), date: key, start: slot.start, dur: 60, title: "做饭：" + d[0],
    note: "食材：" + d[5].split(" ").join("、") + "\n" + d[6], cat: "做饭", done: false, created: Date.now(),
    who: state.currentPerson
  });
  saveState(); render(); closeSheet();
  toast("已排到 " + toHM(slot.start) + " 做饭：" + d[0] + (slot.moved ? "（避开了「" + slot.blocker.title + "」）" : ""));
}

/* ---------- 买菜清单 ---------- */
function addShop(items) {
  state.shop = state.shop || [];
  items.forEach((t) => {
    const name = String(t).trim();
    if (!name) return;
    const ex = state.shop.find((s) => s.text === name);
    if (ex) { ex.done = false; return; }
    state.shop.push({ id: uid(), text: name, done: false });

}

/* ---------- 语音 ---------- */
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $("#btnMic");
  if (!SR) { toast("这个浏览器不支持网页语音，直接用手机输入法键盘上的 🎤 说话也一样"); return; }
  if (!window.isSecureContext) { toast("语音输入需要 https 或本机地址，可以改用输入法的麦克风"); return; }
  let r;
  try { r = new SR(); } catch (e) { toast("语音启动失败，改用键盘上的麦克风吧"); return; }
  r.lang = "zh-CN"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  let got = false;
  r.onstart = () => btn.classList.add("rec");
  r.onresult = (ev) => {
    let txt = "";
    for (let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
    $("#nlInput").value = txt;
    liveHint();
    if (ev.results[ev.results.length - 1].isFinal && !got) { got = true; setTimeout(() => { if ($("#nlInput").value.trim()) applyParsed(parseInput($("#nlInput").value), true); }, 250); }
  };
  r.onerror = (ev) => {
    btn.classList.remove("rec");
    toast(ev.error === "not-allowed" ? "没有麦克风权限，用输入法键盘上的 🎤 也可以" : "语音没听清，再说一次或直接打字");
  };
  r.onend = () => btn.classList.remove("rec");
  try { r.start(); toast("请说话…"); } catch (e) { toast("语音启动失败"); }
}

    let s = "→ " + repTxt + dayShort(it.dateKey) + " " + toHM(it.startMin) + "–" + toHM(it.startMin + it.dur) + " " + it.title +
            "（" + catOf(it.cat.key).emoji + it.cat.key + " · " + it.why + "）";
    if (r.halal.some((h) => h.level === "block")) { s = "⚠️ " + r.halal.find((h) => h.level === "block").why + "，" + r.halal.find((h) => h.level === "block").fix; box.classList.add("warn"); }
    else if (r.halal.length) { s += " · ℹ️ " + r.halal[0].why; box.classList.add("warn"); }

}

    } else {
      e.done = !e.done; saveState(); render(); toast(e.done ? "完成啦 👍" : "已恢复");
    }
  }
  // 今日列表上的操作

    if (!e) return;

    if (b.dataset.act === "done") toggleDone(e, occ);
    else if (b.dataset.act === "edit") openEdit(e.id);
    else if (b.dataset.act === "del") {

  // 横轴：点编号或色段 = 改那一条；点轴上的空白 = 在那个时间新建（按半小时取整）
  $("#tl").addEventListener("click", (ev) => {

    const tr = ev.target.closest(".htrack");
    if (!tr) return;
    const r = tr.getBoundingClientRect();
    if (!r.width) return;
    const f = clamp((ev.clientX - r.left) / r.width, 0, 1);
    const from = parseInt(tr.dataset.from || "0", 10);
    const m = Math.round((from + f * 720) / 30) * 30;   // 一条轴只画 12 小时，所以每像素更精确
    openEdit(null, { start: clamp(m, 0, 23 * 60 + 30) });
  });
}

    '· 日程全部存在这台手机的浏览器里，App 本身不联网、不上传，也没有任何服务器收<br>' +
    '· 家里人在自己手机上打开同一个网址，看到的是他们自己的空白本子，互相看不见<br>' +
    '· 每台手机有自己的本机编号，你的是 <b>' + deviceTag() + '</b>，可以用它确认</div>' +
    '<div style="height:12px"></div>' +
    '<button class="btn" id="pvOk">知道了</button>' +
    '<div style="height:12px"></div>' +
    '<div class="note warn">唯一要留意的是「导出备份」：那段文字里有你全部日程，别发到群里或转给家人。</div>',
    () => { $("#pvOk").onclick = closeSheet; });
}

function init() {
  loadState();
  injectManifest();
  bind();
  $("#tipText").textContent = nextTip(false);
  liveHint();
  render();
  // 只有通过网址（http/https）打开时才注册离线缓存；单独一个文件打开就自动跳过
  try {
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  } catch (e) { /* 忽略 */ }
  if (state.firstRun) { state.firstRun = false; saveState(); setTimeout(showPrivacy, 500); }
  if (!canStore) setTimeout(() => toast("注意：当前打开方式存不了数据，建议用网址打开（见设置里的说明）"), 1500);
  setInterval(() => { if (viewKey === dk(new Date())) renderTimeline(); }, 60000);
}
init();

</script>
</body>
</html>
